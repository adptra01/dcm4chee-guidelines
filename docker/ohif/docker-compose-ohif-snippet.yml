# Tambahkan service ini ke docker-compose.yml utama kamu
# (di bawah service arc, db, ldap, keycloak, mariadb yang sudah ada)

services:
  ohif:
    image: ohif/app:latest
    container_name: ohif-viewer
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      # mount config custom menimpa default config bawaan image
      - ./ohif-app-config.js:/usr/share/nginx/html/app-config.js:ro
    networks:
      - default   # pastikan satu network dengan service arc & keycloak

# Catatan integrasi penting:
#
# 1. CORS di DCM4CHEE
#    DCM4CHEE arc perlu mengizinkan origin OHIF (http://localhost:3000 atau
#    domain produksi) di header Access-Control-Allow-Origin.
#    Ini diatur di Web UI DCM4CHEE:
#      Configuration > Devices > DCM4CHEE > Archive Device Extension
#      > cari atribut "Access Control Allow Origin", isi dengan origin OHIF.
#    Tanpa ini, browser akan blokir request QIDO-RS/WADO-RS dari OHIF (CORS error).
#
# 2. Autentikasi
#    Buat client baru "ohif-viewer" di Keycloak realm yang sama dengan Portal:
#      Keycloak Admin Console > Clients > Create client
#      - Client ID: ohif-viewer
#      - Client authentication: OFF (public client, karena SPA)
#      - Valid redirect URIs: http://localhost:3000/*  (atau domain produksi)
#      - Web origins: http://localhost:3000
#
# 3. Embed ke Portal (Laravel/Filament)
#    Cara paling cepat: buka OHIF via iframe dari halaman Study Browser,
#    lempar StudyInstanceUID sebagai query param:
#      https://ohif.rs-host.local/viewer?StudyInstanceUIDs={uid}
#    Portal cukup simpan/tampilkan UID studi, lalu link/iframe ke URL di atas.
#
# 4. Uji cepat setelah setup:
#    - Buka http://localhost:3000 -> harus redirect ke login Keycloak
#    - Setelah login -> study list harus muncul dari QIDO-RS DCM4CHEE
#    - Klik salah satu studi -> gambar harus render dari WADO-RS
