# PACS Stack: Orthanc + PostgreSQL + OHIF Viewer
# Jalankan:  docker compose up -d
# Hentikan:  docker compose down          (data tetap tersimpan)
# Reset:     docker compose down -v       (data HAPUS permanen)
#
# Endpoint:
#   DICOM       : <host>:4242  (AE: ORTHANC)
#   REST API    : http://<host>:8042  (DICOMweb di /dicom-web)
#   OHIF Viewer : http://<host>:3000
#
# Konfigurasi di bawah bisa di-override via file .env (lihat .env.example).

services:
  db:
    image: postgres:16-alpine
    container_name: pacs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orthanc}
      POSTGRES_USER: ${POSTGRES_USER:-orthanc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orthanc}
    volumes:
      - pacs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orthanc} -d ${POSTGRES_DB:-orthanc}"]
      interval: 5s
      timeout: 5s
      retries: 12

  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: pacs-orthanc
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DICOM_PORT:-4242}:4242"    # DICOM (PZDR / modalitas)
      - "${REST_PORT:-8042}:8042"     # REST API + DICOMweb
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./data/orthanc:/var/lib/orthanc/db
    environment:
      - ORTHANC_PG_DATABASE=${POSTGRES_DB:-orthanc}
      - ORTHANC_PG_USER=${POSTGRES_USER:-orthanc}
      - ORTHANC_PG_PASSWORD=${POSTGRES_PASSWORD:-orthanc}
      - ORTHANC_PG_HOST=db
      - ORTHANC_PG_PORT=5432
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8042/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ohif:
    image: ohif/app:latest
    container_name: pacs-ohif
    restart: unless-stopped
    depends_on:
      - orthanc
    ports:
      - "${OHIF_PORT:-3000}:80"
    environment:
      APP_CONFIG: /usr/share/nginx/html/app-config.js
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro

volumes:
  pacs-db-data:
