[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integration-service"
version = "0.1.0"
description = "ORP Integration — adapter SIMRS eksternal (MORBIS/FHIR/HL7). Penerjemah kontrak, bukan penyimpan data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
