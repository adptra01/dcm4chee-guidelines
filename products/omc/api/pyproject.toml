[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omc-api"
version = "0.1.0"
description = "OMC API — Open Modality Console (pengganti PZDR): import, preview, queue, MWL, MPPS, DICOM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    # NOTE: dicom-core di-wire via path saat MS1 (pip install -e ../../../packages/dicom-core)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
